<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MiniCraft — A Minecraft-style Voxel Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The whole game lives inside this wrapper so it can be embedded as a tab/iframe -->
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- Crosshair in the middle of the screen -->
    <div id="crosshair">+</div>

    <!-- On-screen heads-up display -->
    <div id="hud">
      <div id="fps">FPS: 0</div>
      <div id="position">XYZ: 0, 0, 0</div>
    </div>

    <!-- Hotbar to select which block to place -->
    <div id="hotbar"></div>

    <!-- Start / pause overlay -->
    <div id="overlay">
      <div class="panel">
        <h1>MiniCraft</h1>
        <p class="subtitle">A Minecraft-style voxel game built with Three.js</p>
        <button id="play-button">Click to Play</button>
        <div class="controls">
          <h3>Controls</h3>
          <ul>
            <li><b>W A S D</b> — Move</li>
            <li><b>Mouse</b> — Look around</li>
            <li><b>Space</b> — Jump</li>
            <li><b>Left Click</b> — Break block</li>
            <li><b>Right Click</b> — Place block</li>
            <li><b>1 – 6</b> or <b>Scroll</b> — Select block</li>
            <li><b>Esc</b> — Pause</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Three.js loaded from a CDN via import map (no build step needed) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
